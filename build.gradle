plugins {
    id 'java'
    id 'net.neoforged.moddev' version '0.1.110'
}

version = '1.1.0'
group = 'ghost'
base { archivesName = 'ghost' }

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

neoForge {
    version = '21.1.234'
}

repositories {
    mavenCentral()
}

dependencies {
    // Applied Energistics 2, API only, compile only.
    //
    // AE2 publishes this artifact to Maven Central precisely so other mods can
    // build against it, so nothing has to be vendored into the repository and
    // nobody has to hunt down a jar to compile. It is never needed at runtime -
    // players install AE2 the normal way, and every AE2 call in this mod is
    // guarded by a ModList check so the mod runs fine without it.
    compileOnly 'org.appliedenergistics:appliedenergistics2:19.2.17:api'
}
